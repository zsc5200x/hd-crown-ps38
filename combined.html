<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>同场赛事对照</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style data-source-style>
:root{color-scheme:dark;font-family:"Public Sans",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#eef4fa;background:#10263b}
*{box-sizing:border-box}
body{margin:0;min-width:320px}
header{position:sticky;top:0;z-index:5;background:#eef1ef;border-bottom:0;padding:10px 18px}
.head-row{display:flex;align-items:center;justify-content:space-between;gap:14px}
h1{font-size:20px;line-height:1.25;margin:0;font-weight:720}
.sub{font-size:12px;color:#68736e;margin-top:4px}
.page-status{display:none!important}
.settings-modal{position:fixed;inset:0;z-index:30;display:none;align-items:flex-start;justify-content:center;padding:72px 16px 24px;background:rgba(9,18,32,.52);backdrop-filter:blur(8px)}
.settings-modal.open{display:flex}
.settings-panel{width:min(520px,100%);background:#edf2f7;border:1px solid #9ab4d3;border-radius:18px;box-shadow:0 22px 60px rgba(4,14,29,.38),inset 0 1px rgba(255,255,255,.72);overflow:hidden}
.settings-panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px;background:linear-gradient(135deg,#dfeaf6,#f6f9fc);border-bottom:1px solid #c3d2e2;color:#172b45;font-weight:760}
.settings-panel-body{display:grid;gap:10px;padding:14px}
.settings-source-card{display:grid;gap:10px;padding:13px 14px;border:1px solid #c8d5e2;border-radius:12px;background:rgba(255,255,255,.72);box-shadow:inset 0 1px rgba(255,255,255,.8)}
.settings-source-head{display:flex;align-items:center;justify-content:space-between;gap:10px;color:#1f3651;font-size:13px;font-weight:760}
.settings-source-copy{color:#6b7b8c;font-size:11px;line-height:1.5}
.settings-source-actions{display:flex;gap:8px;flex-wrap:wrap}
.settings-source-actions a,.settings-source-actions button{display:inline-flex;align-items:center;justify-content:center;min-height:32px;padding:6px 11px;border:1px solid #9cb5d1;border-radius:8px;background:#fff;color:#274666;text-decoration:none;font:inherit;font-size:12px;font-weight:700;cursor:pointer}
.settings-source-actions a:hover,.settings-source-actions button:hover{background:#eaf2fb;border-color:#6d9bd2}
.settings-close{width:30px;height:30px;border:1px solid #a9bfd8;border-radius:50%;background:#eaf1f8;color:#47617c;font-size:19px;line-height:1;cursor:pointer}
.nav-row{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:0}
.nav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));width:min(100%,684px);padding:4px;gap:0;margin-top:0;border:1px solid rgba(116,157,204,.42);border-radius:999px;background:linear-gradient(135deg,rgba(17,39,68,.96),rgba(27,50,82,.9));box-shadow:inset 0 1px rgba(255,255,255,.1),inset 0 -8px 18px rgba(5,18,38,.24),0 8px 22px rgba(15,35,61,.12);backdrop-filter:blur(12px)}
.nav a{display:flex;align-items:center;justify-content:center;min-width:0;min-height:42px;padding:7px 16px;border:0;border-radius:999px;background:transparent;color:#b9c8da;text-decoration:none;font-size:13px;font-weight:650;white-space:nowrap;transition:background .24s ease,color .24s ease,box-shadow .24s ease,transform .24s ease}
.nav a:hover{color:#edf5ff;background:rgba(112,153,201,.16)}
.nav a.active{background:linear-gradient(135deg,#5aa0f6,#3985e8);color:#fff;box-shadow:inset 0 1px rgba(255,255,255,.36),0 0 16px rgba(61,139,240,.34);transform:translateY(-1px)}
.settings-button{display:inline-flex;align-items:center;justify-content:center;flex:0 0 44px;width:44px;height:44px;padding:0;border:1px solid rgba(126,164,207,.58);border-radius:50%;background:linear-gradient(145deg,rgba(27,52,84,.96),rgba(15,35,62,.95));color:#c3d3e5;box-shadow:inset 0 1px rgba(255,255,255,.14),0 7px 18px rgba(10,28,52,.18);cursor:pointer;transition:background .24s ease,color .24s ease,border-color .24s ease,box-shadow .24s ease,transform .24s ease}
.settings-button:hover{border-color:#8cb8ed;background:linear-gradient(145deg,#2b588e,#1d426f);color:#fff;box-shadow:inset 0 1px rgba(255,255,255,.22),0 0 15px rgba(78,148,235,.28);transform:translateY(-1px)}
.settings-button:focus-visible{outline:2px solid #8fc1ff;outline-offset:3px}
.settings-button svg{width:18px;height:18px}
main{max-width:1520px;margin:auto;padding:12px}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-bottom:11px}
.stat{padding:9px 12px;background:#fff;border:1px solid #dfe5e2;border-radius:7px;min-width:0}
.stat span{display:block;color:#6c7772;font-size:12px}
.stat strong{display:block;margin-top:3px;font-size:19px;font-variant-numeric:tabular-nums}
.controls{display:grid;grid-template-columns:minmax(180px,1fr) 176px auto;gap:8px;margin-bottom:11px}
input,select{min-width:0;min-height:40px;padding:8px 10px;border:1px solid #ccd5d0;border-radius:6px;background:#fff;color:inherit;font:inherit;font-size:14px}
.tabs{display:flex;gap:0;overflow:auto;border:1px solid #ccd5d0;border-radius:6px;background:#fff}
.tabs button{flex:0 0 auto;min-height:40px;padding:7px 12px;border:0;border-right:1px solid #e1e6e3;background:transparent;color:#52615a;font:inherit;font-size:13px;cursor:pointer}
.tabs button:last-child{border-right:0}
.tabs button[aria-pressed="true"]{background:#e6f1ed;color:#145c4b;font-weight:700}
.section{margin:12px 0 18px}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 2px;border-bottom:1px solid #cfd8d3;color:#44514b;font-size:14px;font-weight:720}
.section-head small{font-size:12px;color:#77817c;font-weight:500}
.event-groups{display:grid;gap:10px;margin-top:10px}
.event-group{overflow:hidden;border:1px solid #dfe5e2;border-radius:7px;background:#fff}
.event-group.collapsed .event-group-body{display:none}
.event-group-head{display:flex;width:100%;min-height:48px;align-items:center;justify-content:space-between;gap:12px;padding:10px 13px;border:0;background:#fff;color:inherit;text-align:left;font:inherit;cursor:pointer}
.event-group-head:hover,.league-head:hover{background:#f7f9f8}
.event-group-title{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:740}
.event-group-title::before{width:8px;height:8px;border-radius:50%;background:#79857f;content:""}
.event-group.live .event-group-title::before{background:#c83c2f}
.event-group-count{margin-left:auto;color:#737d77;font-size:12px;font-weight:550;white-space:nowrap}
.event-group-toggle,.league-toggle{display:inline-flex;width:24px;height:24px;flex:none;align-items:center;justify-content:center;border-radius:5px;background:#f0f3f1;color:#4d5a53;transition:transform .18s}
.event-group.collapsed .event-group-toggle,.league.collapsed .league-toggle{transform:rotate(-90deg)}
.event-group-body{padding:0 9px 9px;background:#f6f8f7}
.league{margin-top:8px;overflow:hidden;border:1px solid #dfe5e2;border-radius:6px;background:#fff}
.league-head{display:flex;width:100%;min-height:42px;align-items:center;gap:9px;padding:8px 10px;border:0;border-bottom:1px solid #e5eae7;background:#fff;color:#34453d;text-align:left;font:inherit;cursor:pointer}
.league-name{min-width:0;flex:1;font-size:13px;font-weight:720;overflow-wrap:anywhere}
.league-count{color:#737d77;font-size:11px;font-weight:550;white-space:nowrap}
.league.collapsed .league-body{display:none}
.event{margin:0;background:#fff;border:0;border-bottom:1px solid #e6ebe8;overflow:hidden}
.event:last-child{border-bottom:0}
.event-head{display:grid;grid-template-columns:minmax(0,1fr) 84px minmax(0,1fr);align-items:center;gap:12px;padding:12px 13px 9px}
.team{min-width:0;font-size:15px;font-weight:720;overflow-wrap:anywhere}
.team.home{text-align:right}
.team.away{text-align:left}
.center{text-align:center;color:#59645f;font-size:13px;font-variant-numeric:tabular-nums}
.center small{display:block;margin-top:4px;color:#77817c;font-size:11px;line-height:1.35}
.match-status{display:flex;align-items:center;gap:7px;padding:0 13px 8px;color:#738078;font-size:11px}
.status-label{padding:2px 6px;border-radius:3px;background:#e8f2ee;color:#16624f;font-weight:680}
.status-label.candidate{background:#fff4dd;color:#8a5a09}
.status-label.conflict{background:#fbe9e7;color:#a43128}
.status-label.unmatched{background:#eef1ef;color:#65716b}
.time-debug{display:flex;flex-wrap:wrap;gap:5px 12px;padding:6px 14px;border-bottom:1px solid #e6ebe8;background:#fbfcfb;color:#69756e;font-size:11px;line-height:1.4;font-variant-numeric:tabular-nums}
.time-debug span{white-space:nowrap}
.raw-detail{margin:0;padding:9px 12px;border-top:1px solid #e6ebe8;background:#f7faf8;color:#53615a;font:11px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;overflow:auto;max-height:260px}
.sources{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(270px,.72fr);align-items:stretch}
.sources.single{grid-template-columns:1fr}
.source{display:flex;min-width:0;flex-direction:column;padding:8px 10px;background:#f7f8f8}
.source+.source{border-left:1px solid #e2e8e4}
.source-title{display:block;margin:-8px -10px 7px;padding:7px 9px;border-radius:5px 5px 0 0;color:#fff;font-size:13px;font-weight:740;line-height:1.2}
.source-crown .source-title{background:#85232a}
.source-pinnacle .source-title{background:#29465f}
.source-comparison .source-title{background:#176b58}
.source-title>span:first-child{display:block;font-size:13px;font-weight:740}
.format{display:block;margin-top:3px;color:rgba(255,255,255,.78);font-size:9px;font-weight:500}
.markets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:auto minmax(0,1fr);gap:8px;align-items:stretch;flex:1}
.market-moneyline{grid-column:1/-1}
.market{display:flex;min-width:0;flex-direction:column;border:0;border-radius:0;overflow:visible;background:transparent}
.market-title{display:flex;align-items:center;justify-content:space-between;padding:7px 9px;background:#eef0f0;border:1px solid #dfe3e1;border-bottom:0;text-align:left;color:#171b19;font-size:12px;font-weight:760}
.market-title::after{content:"";width:5px;height:5px;border-radius:50%;background:#98a09c}
.market-count{margin-left:auto;margin-right:8px;color:#7b8580;font-size:9px;font-weight:560}
.quote{position:relative;display:grid;grid-template-columns:1fr;gap:0;margin:0 0 5px;padding:4px 6px;border:1px solid #e2e5e3;border-radius:6px;border-top:1px solid #edf0ee;background:#fff;font-size:11px;overflow:hidden}
.quote:first-of-type{border-top-color:#e2e5e3}
.quote-moneyline{grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;padding:7px 8px}
.quote-side{display:flex;min-width:0;min-height:27px;flex-direction:row;align-items:center;justify-content:space-between;gap:5px;padding:4px 3px;border:0;border-bottom:1px solid #edf0ee;background:transparent;text-align:left}
.quote:not(.quote-moneyline) .quote-side:nth-child(2){border-bottom:0}
.quote-moneyline .quote-side{min-height:38px;flex-direction:column;align-items:center;justify-content:center;padding:2px 4px;border:0;text-align:center}
.quote-name{min-width:0;color:#171b19;font-size:11px;line-height:1.25;overflow-wrap:anywhere}
.quote-line{color:#242a27;font-size:12px;line-height:1.35;overflow-wrap:anywhere}
.quote-odds{flex:none;color:#df2e16;font-size:13px;line-height:1.1;font-weight:800;font-variant-numeric:tabular-nums}
.quote-odds.odds-updated{border-radius:3px;animation:odds-change 1.2s ease-out}
.quote-odds.odds-up{--odds-flash:#d8f3e2;--odds-flash-text:#14733d}
.quote-odds.odds-down{--odds-flash:#ffe2dd;--odds-flash-text:#b42318}
@keyframes odds-change{0%{background:var(--odds-flash);color:var(--odds-flash-text);box-shadow:0 0 0 4px var(--odds-flash)}100%{background:transparent;color:#df2e16;box-shadow:0 0 0 0 transparent}}
.quote-meta{grid-column:1/-1;display:flex;justify-content:flex-end;gap:8px;min-width:0;margin-top:-1px;color:#969e9a;font-size:10px;line-height:1.2;overflow-wrap:anywhere}
.quote-id{color:#8a948e;font-size:10px;overflow-wrap:anywhere}
.market-extra{display:flex;justify-content:flex-start;margin:0;padding:3px 8px;background:#f8faf9;border:1px solid #e2e5e3;border-top:0;color:#7b8580;font-size:9px;font-weight:550;text-align:left}
.empty{padding:12px 4px;text-align:center;color:#929b96;font-size:11px}
.evidence{padding:7px 12px;border-top:1px solid #e6ebe8;color:#6d7972;font-size:11px;line-height:1.5}
.actions{display:flex;gap:7px;flex-wrap:wrap;padding:8px 12px;border-top:1px solid #e6ebe8;background:#fafbfa}
.action{min-height:32px;padding:5px 9px;border:1px solid #cbd5d0;border-radius:5px;background:#fff;color:#405148;font-size:12px;font-weight:650;cursor:pointer}
.action.primary{border-color:#176b58;background:#176b58;color:white}
.action:disabled{opacity:.55;cursor:wait}
.comparison-content{display:flex;min-width:0;flex-direction:column;gap:8px}
.comparison-group{min-width:0;border:1px solid #dfe5e2;border-radius:5px;background:#fff;overflow:hidden}
.comparison-group-title{display:flex;justify-content:space-between;gap:6px;padding:6px 7px;background:#eef3f0;color:#33443b;font-size:11px;font-weight:740}
.comparison-group-title small{color:#748078;font-size:9px;font-weight:500}
.comparison-line{padding:6px 7px;border-top:1px solid #edf0ee}
.comparison-line:first-of-type{border-top:0}
.comparison-line-head{display:flex;justify-content:space-between;gap:6px;align-items:flex-start;color:#26332d;font-size:10px;font-weight:650;line-height:1.35}
.comparison-line-head>span:first-child{min-width:0;overflow-wrap:anywhere}
.comparison-roi{flex:none;color:#52665c;font-size:10px;font-weight:760;font-variant-numeric:tabular-nums}
.comparison-roi.positive{color:#117044}
.comparison-roi.negative{color:#a43128}
.comparison-line-detail{margin-top:3px;color:#78827d;font-size:9px;line-height:1.4;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.comparison-status{padding:9px 7px;color:#78827d;font-size:10px;line-height:1.45;overflow-wrap:anywhere}
.comparison-footnote{padding:0 2px;color:#818b85;font-size:9px;line-height:1.4}
.empty-state{padding:26px 16px;border:1px solid #dfe5e2;border-radius:7px;background:#fff;text-align:center;color:#707b75;line-height:1.6}
.error{color:#a43128}
@media(max-width:1100px){.sources{grid-template-columns:repeat(2,minmax(0,1fr))}.source-comparison{grid-column:1/-1;border-left:0!important;border-top:1px solid #e2e8e4}.comparison-content{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:start}}
@media(max-width:760px){header{padding:11px 12px}.head-row{align-items:flex-start}.head-row h1{font-size:18px}.nav-row{gap:7px}.nav a{min-height:40px;padding-inline:8px;font-size:12px}.settings-button{flex-basis:40px;width:40px;height:40px}.settings-modal{padding:22px 9px}main{padding:8px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.controls{grid-template-columns:1fr 130px}.tabs{grid-column:1/-1}.sources{grid-template-columns:1fr}.source+.source{border-left:0;border-top:1px solid #e2e8e4}.source-comparison{grid-column:auto}.comparison-content{grid-template-columns:1fr}.source-title{margin:-8px -10px 8px}.markets{grid-template-columns:repeat(2,minmax(0,1fr))}.event-head{grid-template-columns:minmax(0,1fr) 56px minmax(0,1fr);gap:5px;padding:10px}.team{font-size:13px}.quote{padding:4px 5px}.market-title{padding-inline:8px}.market-extra{padding-inline:8px}}
@media(max-width:520px){.markets{grid-template-columns:1fr}.market-moneyline{grid-column:1}.quote-moneyline{grid-template-columns:repeat(3,minmax(0,1fr));gap:3px}.quote-meta{grid-column:1/-1}.quote-name,.quote-line{font-size:10px}.quote-odds{font-size:12px}}

/* Pinnodds-inspired gray operations theme */
:root{
  color-scheme:dark;
  --page-bg:#10263b;
  --surface:#172f46;
  --surface-raised:#1d3a54;
  --surface-soft:#223f59;
  --surface-deep:#142b41;
  --line:#2a4359;
  --line-soft:#233b50;
  --text:#eef4fa;
  --text-strong:#ffffff;
  --muted:#b9c9d7;
  --muted-2:#98adbf;
  --accent:#69b4ff;
  --positive:#46d39c;
}
html{background:#10263b;min-height:100%;}
body{
  min-height:100vh;
  background:linear-gradient(180deg,#16324d 0%,#10263b 46%,#0d2033 100%);
  color:#eef4fa;
}
header{
  background:rgba(21,27,34,.92);
  border-bottom:1px solid rgba(111,133,154,.28);
  box-shadow:0 10px 26px rgba(0,0,0,.16);
}
main{background:transparent}
.stat,.league,.event-group,.event,.notice,.empty-state,.comparison-group{
  background:var(--surface);
  border-color:var(--line);
  box-shadow:0 8px 24px rgba(0,0,0,.14);
}
.stat small,.league-count,.event-group-count,.sub,.comparison-group-title small,.comparison-status,.comparison-footnote{
  color:var(--muted);
}
.stat strong,.event-group-title,.league-name,.team,.quote-name,.quote-line,.comparison-line-head,.comparison-group-title{
  color:var(--text-strong);
}
.stat{background:linear-gradient(145deg,#222b34,#1c232b)}
.league-head,.event-group-head{
  background:linear-gradient(180deg,#28323c,#232c35);
  color:var(--text-strong);
  border-bottom-color:var(--line);
}
.league-head:hover,.event-group-head:hover{background:#303b46}
.event-group-body{background:rgba(17,22,28,.48)}
.match,.event{background:#1b222a;border-bottom-color:var(--line-soft)}
.match-status,.time-debug,.evidence{color:var(--muted)}
.time-debug{background:#202831;border-bottom-color:var(--line-soft)}
.raw-detail{background:#161c22;border-top-color:var(--line-soft);color:#a9b7c5}
input,select,.tabs,.action{
  background:#222b34;
  color:var(--text);
  border-color:#43515e;
}
input::placeholder{color:#718091}
input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(77,163,255,.18);outline:0}
.tabs{background:#202831}
.tabs button{color:#a9b6c3;border-right-color:#3a4652}
.tabs button[aria-pressed="true"]{background:#31506c;color:#fff}
.market,.crown-market-card,.crown-moneyline{
  background:var(--surface-deep);
  border-color:var(--line);
}
.market-title,.crown-market-card .market-title{
  background:#28323b;
  color:var(--text-strong);
  border-color:var(--line);
}
.quote,.crown-market-row,.crown-moneyline-cell{
  background:#202831;
  border-color:#34414c;
  color:var(--text);
}
.quote-side{background:transparent;border-bottom-color:#34414c}
.line,.quote-name,.quote-line,.crown-market-label,.crown-moneyline-cell span{color:#c0cbd5}
.market-extra,.crown-market-footer{background:#1a2128;border-color:#34414c;color:var(--muted)}
.empty-price,.crown-market-empty,.empty{color:var(--muted-2)}
.status-label{background:rgba(53,211,154,.16);color:#65e5b5}
.status-label.candidate{background:rgba(239,181,93,.16);color:#f2c77e}
.status-label.conflict{background:rgba(239,102,102,.16);color:#ff9f9f}
.status-label.unmatched{background:#2b343e;color:#aab7c4}
.action:not(.primary){background:#242e38;color:#d8e0e7;border-color:#43515e}
.action:not(.primary):hover{background:#2d3945}
.settings-panel,.pinnacle-panel,.login-panel{
  background:#202831;
  border-color:#43515e;
  color:var(--text);
}
.settings-panel-head{
  background:linear-gradient(135deg,#293746,#202a34);
  border-bottom-color:#43515e;
  color:var(--text-strong);
}
.settings-source-card{background:#252f39;border-color:#43515e;box-shadow:inset 0 1px rgba(255,255,255,.04)}
.settings-source-head{color:var(--text-strong)}
.settings-source-copy,.login-status-copy,.login-help{color:var(--muted)}
.settings-source-actions a,.settings-source-actions button,.pinnacle-config-button,.action-button{
  background:#27323c;
  color:#dbe5ed;
  border-color:#4a5967;
}
.settings-source-actions a:hover,.settings-source-actions button:hover,.pinnacle-config-button:hover,.action-button:hover{background:#31404d;border-color:#6795be}
.settings-close,.pinnacle-close,.close-button{
  background:#2a3540;
  color:#c4d0db;
  border-color:#4b5a68;
}
.pinnacle-panel-body input,.account-form input,.otp-form input{
  background:#1a222a;
  color:var(--text);
  border-color:#43515e;
}
.login-status{background:#252f39;border-color:#43515e}
.account-row{background:#242e38;border-color:#43515e}
.account-row-meta,.account-row-status,.account-list-title,.login-panel-body label,.account-form label{color:#c0cbd5}
.comparison-line{border-top-color:#34414c}
.comparison-group-title{background:#29343e}
.comparison-line-detail{color:#9aa8b7}
.source{background:#1b2229}
.source+.source{border-left-color:#394651}
.notice,.empty-state{color:#b6c2cd}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}
}

/* Sports data terminal: deep-blue field, quiet surfaces, readable odds. */
:root{
  color-scheme:dark;
  --ground:#10263b;
  --ground-deep:#0d2033;
  --surface:#172f46;
  --surface-raised:#1d3a54;
  --surface-soft:#223f59;
  --surface-deep:#142b41;
  --line:#35516a;
  --line-soft:#2a455e;
  --text:#eef4fa;
  --text-strong:#ffffff;
  --muted:#b3c3d2;
  --muted-2:#91a6b9;
  --accent:#69b4ff;
  --positive:#46d39c;
  --negative:#ff8585;
  --font:"Public Sans",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html{min-height:100%;background:var(--ground-deep);scrollbar-color:#45637d var(--ground-deep)}
body{
  min-width:320px;
  min-height:100vh;
  margin:0;
  color:var(--text);
  font-family:var(--font);
  background:linear-gradient(180deg,#16324d 0%,#10263b 46%,#0d2033 100%);
}
button,input,select{font:inherit}
button,a,input,select,summary{-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header.site-header{
  position:relative;
  z-index:5;
  padding:18px clamp(16px,3vw,40px) 14px;
  background:#122a41;
  border-bottom:1px solid #2b4862;
}
.header-shell{
  display:flex;
  max-width:1600px;
  align-items:center;
  justify-content:space-between;
  gap:24px;
  margin:0 auto;
}
.brand-block{min-width:0}
.brand-block h1{margin:0;color:var(--text-strong);font-size:22px;font-weight:700;line-height:1.2;letter-spacing:-.02em}
.brand-block p{margin:5px 0 0;color:var(--muted);font-size:13px;line-height:1.35}
.nav-actions{display:flex;min-width:0;align-items:center;gap:12px}
.nav-row{display:flex;min-width:0;align-items:center;justify-content:flex-end;gap:10px;margin:0}
.nav{
  display:flex;
  width:auto;
  max-width:100%;
  gap:4px;
  overflow-x:auto;
  padding:4px;
  border:1px solid #365571;
  border-radius:999px;
  background:#0f2539;
  scrollbar-width:none;
}
.nav::-webkit-scrollbar,.tabs::-webkit-scrollbar{display:none}
.nav a{
  display:flex;
  min-width:max-content;
  min-height:40px;
  align-items:center;
  justify-content:center;
  padding:8px 16px;
  border:0;
  border-radius:999px;
  background:transparent;
  color:#c0cedb;
  font-size:13px;
  font-weight:650;
  text-decoration:none;
  white-space:nowrap;
  transition:background-color .16s ease,color .16s ease;
}
.nav a:hover{background:#1c3852;color:#fff}
.nav a.active{background:#2e73ad;color:#fff}
.settings-button{
  display:inline-flex;
  width:42px;
  height:42px;
  flex:0 0 42px;
  align-items:center;
  justify-content:center;
  padding:0;
  border:1px solid #45627b;
  border-radius:50%;
  background:#1a354d;
  color:#d4e1ec;
  cursor:pointer;
  transition:background-color .16s ease,border-color .16s ease,color .16s ease;
}
.settings-button:hover{border-color:#6ea8d9;background:#234765;color:#fff}
.settings-button svg{width:18px;height:18px}
.page-status{
  display:block!important;
  max-width:1600px;
  min-height:18px;
  margin:10px auto 0;
  color:#a9bdcf;
  font-size:12px;
  line-height:1.5;
  font-variant-numeric:tabular-nums;
}
.page-status:empty{display:none!important}
main{width:min(100%,1600px);margin:0 auto;padding:22px clamp(16px,3vw,40px) 48px;background:transparent}
.stats{
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:0;
  margin:0 0 14px;
  overflow:hidden;
  border:1px solid #35526b;
  border-radius:12px;
  background:#162e45;
}
.stat{min-width:0;padding:13px 16px;border:0;border-radius:0;background:transparent;box-shadow:none}
.stat+.stat{border-left:1px solid #35516a}
.stat span{display:block;color:#b3c3d2;font-size:12px;line-height:1.35}
.stat strong{display:block;margin-top:5px;color:#f4f8fc;font-size:21px;font-weight:650;line-height:1.1;font-variant-numeric:tabular-nums}
.controls{
  display:grid;
  grid-template-columns:minmax(220px,1fr) 180px minmax(390px,auto);
  gap:10px;
  align-items:center;
  margin:0 0 14px;
}
input,select{
  min-width:0;
  min-height:42px;
  padding:9px 12px;
  border:1px solid #3a5872;
  border-radius:8px;
  background:#142b41;
  color:#edf4fa;
  font-size:14px;
}
input::placeholder{color:#9db0c1;opacity:1}
input:focus,select:focus{border-color:#69b4ff;outline:2px solid rgba(105,180,255,.24);outline-offset:1px}
.tabs{
  display:flex;
  min-width:0;
  gap:4px;
  overflow-x:auto;
  padding:3px;
  border:1px solid #35516a;
  border-radius:999px;
  background:#142b41;
  scrollbar-width:thin;
  scrollbar-color:#466682 transparent;
}
.tabs button{
  min-height:34px;
  flex:0 0 auto;
  padding:7px 12px;
  border:0;
  border-radius:999px;
  background:transparent;
  color:#c1d0de;
  font-size:12px;
  font-weight:600;
  white-space:nowrap;
  cursor:pointer;
}
.tabs button:hover{background:#203d57;color:#fff}
.tabs button[aria-pressed="true"]{background:#2e78b7;color:#fff;font-weight:700}
.section{margin:18px 0 24px}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 2px 11px;border:0;color:var(--text-strong)}
.section-head h2{margin:0;font-size:17px;font-weight:680;line-height:1.3}
.section-head small{color:#b5c5d3;font-size:13px;font-weight:550;font-variant-numeric:tabular-nums}
.event-groups{display:grid;gap:12px;margin-top:0}
.event-group,.league,.event,.empty-state,.comparison-group{
  border:1px solid #35516a;
  border-radius:10px;
  background:#172f46;
  box-shadow:none;
}
.event-group{overflow:hidden}
.event-group.collapsed .event-group-body{display:none}
.event-group-head{
  display:flex;
  width:100%;
  min-height:48px;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:10px 15px;
  border:0;
  background:#1c3852;
  color:#f1f6fb;
  text-align:left;
  font:inherit;
  cursor:pointer;
}
.event-group-head:hover,.league-head:hover{background:#244562}
.event-group-title{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:700}
.event-group-title::before{width:8px;height:8px;border-radius:50%;background:#66829a;content:""}
.event-group.live .event-group-title::before{background:#ff7373}
.event-group-count{margin-left:auto;color:#c1cfdb;font-size:12px;font-weight:550;white-space:nowrap;font-variant-numeric:tabular-nums}
.event-group-toggle,.league-toggle{display:inline-flex;width:25px;height:25px;flex:none;align-items:center;justify-content:center;border-radius:7px;background:#294966;color:#e0eaf2;transition:transform .16s ease}
.event-group.collapsed .event-group-toggle,.league.collapsed .league-toggle{transform:rotate(-90deg)}
.event-group-body{padding:0 10px 10px;background:#132b41}
.league{margin-top:10px;overflow:hidden;border-color:#304d66;background:#152d43}
.league-head{
  display:flex;
  width:100%;
  min-height:44px;
  align-items:center;
  gap:10px;
  padding:9px 12px;
  border:0;
  border-bottom:1px solid #304d66;
  background:#1a354e;
  color:#eaf2f8;
  text-align:left;
  font:inherit;
  cursor:pointer;
}
.league-name{min-width:0;flex:1;font-size:13px;font-weight:680;overflow-wrap:anywhere}
.league-count{color:#b6c7d6;font-size:12px;font-weight:550;white-space:nowrap;font-variant-numeric:tabular-nums}
.league.collapsed .league-body{display:none}
.event{margin:0;border:0;border-bottom:1px solid #30495f;border-radius:0;background:#172f46;overflow:hidden}
.event:last-child{border-bottom:0}
.event-head{display:grid;grid-template-columns:minmax(0,1fr) 94px minmax(0,1fr);align-items:center;gap:14px;padding:15px 16px 11px}
.team{min-width:0;color:#f0f5fa;font-size:15px;font-weight:680;line-height:1.35;overflow-wrap:anywhere}
.team.home{text-align:right}
.team.away{text-align:left}
.center{text-align:center;color:#e3edf5;font-size:14px;font-weight:650;font-variant-numeric:tabular-nums}
.center small{display:block;margin-top:4px;color:#b7c7d5;font-size:12px;line-height:1.35;font-weight:450}
.center small.event-id{overflow-wrap:anywhere}
.match-status{display:flex;align-items:center;gap:8px;padding:0 16px 11px;color:#b8c7d5;font-size:12px}
.status-label{padding:3px 8px;border-radius:999px;background:#284c68;color:#d9ecfb;font-size:12px;font-weight:650}
.status-label.candidate{background:#584a31;color:#ffe0a0}
.status-label.conflict{background:#553541;color:#ffc1cb}
.status-label.unmatched{background:#2b4357;color:#c5d2de}
.time-debug{display:flex;flex-wrap:wrap;gap:6px 12px;padding:8px 16px;border-bottom:1px solid #2c485f;background:#142b41;color:#b4c5d3;font-size:12px;line-height:1.45;font-variant-numeric:tabular-nums}
.time-debug span{white-space:nowrap}
.raw-detail{max-height:260px;margin:0;padding:10px 14px;overflow:auto;border-top:1px solid #2c485f;background:#10263a;color:#c6d3df;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap}
.sources{
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(280px,.82fr);
  align-items:stretch;
}
.sources.single{grid-template-columns:1fr}
.source{display:flex;min-width:0;flex-direction:column;padding:10px 12px;background:#172f46}
.source+.source{border-left:1px solid #35516a}
.source-title{
  display:flex;
  min-height:49px;
  flex-direction:column;
  justify-content:center;
  gap:3px;
  margin:-10px -12px 9px;
  padding:9px 12px;
  border:0;
  border-bottom:1px solid #35516a;
  border-radius:0;
  background:#1b3852;
  color:#eff5fa;
  font-size:14px;
  font-weight:700;
  line-height:1.25;
}
.source-crown .source-title,.source-pinnacle .source-title,.source-comparison .source-title{background:#1b3852}
.source-title>span:first-child{font-size:14px;font-weight:700}
.format{display:block;margin:0;color:#b9c9d7;font-size:12px;font-weight:450;line-height:1.35}
.markets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:auto minmax(0,1fr);gap:9px;align-items:stretch;flex:1}
.market-moneyline{grid-column:1/-1}
.market{display:flex;min-width:0;flex-direction:column;overflow:hidden;border:1px solid #34516a;border-radius:8px;background:#142b41}
.market-title{display:flex;min-height:36px;align-items:center;justify-content:space-between;gap:8px;padding:7px 9px;border:0;border-bottom:1px solid #34516a;background:#1c3852;color:#eaf2f8;text-align:left;font-size:13px;font-weight:680}
.market-title::after{width:6px;height:6px;flex:none;border-radius:50%;background:#6fa9d5;content:""}
.market-count{margin:0 0 0 auto;color:#bdcbd7;font-size:12px;font-weight:500}
.quote{
  position:relative;
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:0 8px;
  margin:0;
  padding:6px 9px 5px;
  overflow:visible;
  border:0;
  border-bottom:1px solid #2b465d;
  border-radius:0;
  background:#152d43;
  color:#e9f0f6;
  font-size:13px;
}
.quote:last-child{border-bottom:0}
.quote-moneyline{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:9px}
.quote-side{
  display:grid;
  min-width:0;
  min-height:34px;
  grid-template-columns:minmax(0,1fr) minmax(5ch,auto);
  align-items:center;
  gap:7px;
  padding:5px 2px;
  border:0;
  border-bottom:1px solid #2b465d;
  background:transparent;
  text-align:left;
}
.quote:not(.quote-moneyline) .quote-side:nth-child(2){border-bottom:0}
.quote-moneyline .quote-side{
  min-height:55px;
  grid-template-columns:minmax(0,1fr);
  align-content:center;
  justify-items:center;
  gap:5px;
  padding:6px 3px;
  border:0;
  text-align:center;
}
.quote-name{min-width:0;color:#c3d1dd;font-size:12px;line-height:1.35;overflow-wrap:anywhere}
.quote-line{color:#dbe6ef;font-size:12px;line-height:1.35;overflow-wrap:anywhere}
.quote-odds{
  min-width:5ch;
  justify-self:end;
  color:#f3f7fa;
  text-align:right;
  font-size:14px;
  line-height:1.2;
  font-weight:700;
  font-variant-numeric:tabular-nums;
  white-space:nowrap;
  overflow:visible;
}
.quote-moneyline .quote-odds{justify-self:center;font-size:15px}
.quote-odds.odds-updated{border-radius:4px;animation:odds-change 1.2s ease-out}
.quote-odds.odds-up{--odds-flash:#173e36;--odds-flash-text:#70e1b3}
.quote-odds.odds-down{--odds-flash:#482b36;--odds-flash-text:#ffaaaa}
@keyframes odds-change{0%{background:var(--odds-flash);color:var(--odds-flash-text)}100%{background:transparent;color:#f3f7fa}}
.quote-meta{grid-column:1/-1;display:flex;justify-content:flex-end;gap:8px;min-width:0;margin-top:4px;color:#aebfce;font-size:12px;line-height:1.3;overflow-wrap:anywhere}
.quote-id{color:#aebfce;font-size:12px;overflow-wrap:anywhere}
.market-extra{display:flex;justify-content:flex-start;margin:0;padding:6px 9px;border:0;border-top:1px solid #2b465d;background:#132a40;color:#b4c5d3;font-size:12px;font-weight:500;text-align:left}
.empty{padding:14px 8px;color:#b8c7d5;text-align:center;font-size:13px}
.evidence{padding:9px 14px;border-top:1px solid #35516a;color:#c1cfdb;font-size:12px;line-height:1.5}
.evidence summary{width:max-content;max-width:100%;color:#a9d3f5;font-size:12px;font-weight:600;cursor:pointer}
.evidence>div{margin-top:7px;color:#c6d4df}
.actions{display:flex;gap:8px;flex-wrap:wrap;padding:10px 14px;border-top:1px solid #35516a;background:#142b41}
.action{min-height:36px;padding:7px 11px;border:1px solid #49657d;border-radius:7px;background:#1b3852;color:#e2ecf4;font-size:13px;font-weight:600;cursor:pointer}
.action:hover{background:#254766}
.action.primary{border-color:#387eb7;background:#2e78b7;color:#fff}
.action.primary:hover{background:#3989c7}
.action:disabled{opacity:.6;cursor:wait}
.comparison-content{display:flex;min-width:0;flex-direction:column;gap:9px}
.comparison-group{min-width:0;overflow:hidden;border-radius:8px;background:#142b41}
.comparison-group-title{display:flex;justify-content:space-between;gap:8px;padding:9px 10px;border-bottom:1px solid #34516a;background:#1c3852;color:#e9f1f7;font-size:13px;font-weight:680}
.comparison-group-title small{color:#bbcbd8;font-size:12px;font-weight:500}
.comparison-line{padding:9px 10px;border-top:1px solid #2b465d}
.comparison-line:first-of-type{border-top:0}
.comparison-line-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;color:#edf3f8;font-size:13px;font-weight:600;line-height:1.4}
.comparison-line-head>span:first-child{min-width:0;overflow-wrap:anywhere}
.comparison-roi{flex:none;color:#d8e3ec;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.comparison-roi.positive{color:#63dfad}
.comparison-roi.negative{color:#ff9e9e}
.comparison-line-detail{margin-top:5px;color:#bdcbd7;font-size:12px;line-height:1.5;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.comparison-status{padding:12px 10px;color:#bdcbd7;font-size:13px;line-height:1.5;overflow-wrap:anywhere}
.comparison-footnote{padding:2px 2px;color:#afc0ce;font-size:12px;line-height:1.45}
.empty-state{padding:22px 16px;color:#cedae4;text-align:center;line-height:1.6}
.error{color:#ff9e9e}
.settings-modal{
  position:fixed;
  inset:0;
  z-index:30;
  display:none;
  align-items:flex-start;
  justify-content:center;
  padding:72px 16px 24px;
  overflow:auto;
  background:rgba(5,15,26,.76);
}
.settings-modal.open{display:flex}
.settings-panel{
  width:min(520px,100%);
  overflow:hidden;
  border:1px solid #42617c;
  border-radius:14px;
  background:#172f46;
  color:var(--text);
  box-shadow:0 18px 44px rgba(0,0,0,.28);
}
.settings-panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 18px;border-bottom:1px solid #35516a;background:#1b3852;color:#f1f6fa;font-size:15px;font-weight:700}
.settings-panel-body{display:grid;gap:10px;padding:14px}
.settings-source-card{display:grid;gap:9px;padding:13px 14px;border:1px solid #35516a;border-radius:9px;background:#142b41;box-shadow:none}
.settings-source-head{display:flex;align-items:center;justify-content:space-between;gap:10px;color:#edf4f9;font-size:13px;font-weight:680}
.settings-source-copy{color:#bdcbd7;font-size:12px;line-height:1.5}
.settings-source-actions{display:flex;gap:8px;flex-wrap:wrap}
.settings-source-actions a,.settings-source-actions button{
  display:inline-flex;
  min-height:38px;
  align-items:center;
  justify-content:center;
  padding:8px 12px;
  border:1px solid #46647e;
  border-radius:7px;
  background:#1c3852;
  color:#e4edf4;
  font-size:13px;
  font-weight:650;
  text-decoration:none;
  cursor:pointer;
}
.settings-source-actions a:hover,.settings-source-actions button:hover{border-color:#6ea8d9;background:#254766}
.settings-close{width:34px;height:34px;border:1px solid #496781;border-radius:50%;background:#203d57;color:#e4edf4;font-size:19px;line-height:1;cursor:pointer}
.settings-close:hover{background:#2a4c69}
@media(max-width:1100px){
  .controls{grid-template-columns:minmax(180px,1fr) 170px}
  .tabs{grid-column:1/-1}
  .sources{grid-template-columns:repeat(2,minmax(0,1fr))}
  .source-comparison{grid-column:1/-1;border-top:1px solid #35516a;border-left:0!important}
  .comparison-content{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:start}
}
@media(max-width:760px){
  header.site-header{padding:14px 16px 12px}
  .header-shell{align-items:stretch;flex-direction:column;gap:12px}
  .brand-block h1{font-size:20px}
  .brand-block p{font-size:12px}
  .nav-actions{gap:8px}
  .nav-row{flex:1;justify-content:flex-start}
  .nav{width:100%;justify-content:flex-start}
  .nav a{min-height:40px;padding:8px 13px;font-size:12px}
  .settings-button{width:40px;height:40px;flex-basis:40px}
  .page-status{margin-top:9px;font-size:12px}
  main{padding:16px 16px 36px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr));border-radius:10px}
  .stat{padding:11px 12px}
  .stat+.stat{border-left:0}
  .stat:nth-child(even){border-left:1px solid #35516a}
  .stat:nth-child(n+3){border-top:1px solid #35516a}
  .stat:last-child:nth-child(odd){grid-column:1/-1;border-left:0}
  .stat strong{font-size:19px}
  .controls{grid-template-columns:minmax(0,1fr) 126px;gap:8px}
  .controls input,.controls select{min-height:44px;font-size:13px}
  .tabs{grid-column:1/-1;gap:3px}
  .tabs button{min-height:38px;padding:7px 11px;font-size:12px}
  .section{margin-top:16px}
  .section-head{padding-bottom:9px}
  .section-head h2{font-size:16px}
  .event-group-body{padding:0 7px 7px}
  .league-head{min-height:44px;padding:9px 10px}
  .event-head{grid-template-columns:minmax(0,1fr) 72px minmax(0,1fr);gap:7px;padding:13px 10px 10px}
  .team{font-size:13px;line-height:1.35}
  .center{font-size:13px}
  .center small{font-size:12px}
  .match-status{padding:0 10px 10px}
  .sources{
    display:grid;
    width:100%;
    grid-template-columns:none;
    grid-auto-columns:minmax(280px,86%);
    grid-auto-flow:column;
    align-items:stretch;
    overflow-x:auto;
    overflow-y:hidden;
    overscroll-behavior-inline:contain;
    scroll-snap-type:x proximity;
    scrollbar-width:thin;
    scrollbar-color:#4a6a85 #132a40;
    border-top:1px solid #35516a;
  }

  const allEvents=Array.isArray(data.all_events)?data.all_events:legacyAllEvents(data);

  const query=$("search").value.trim().toLowerCase();const filter=$("stateFilter").value;
  const rows=(state.tab==="all"?allEvents:state.tab==="matched"?confirmed:state.tab==="candidates"?candidates:state.tab==="conflicts"?conflicts:unmatched).filter(row=>{
    const crown=row.crown||row;if(query&&!searchable(row).includes(query))return false;
    if(filter==="live"&&!isLive(crown))return false;if(filter==="prematch"&&isLive(crown))return false;return true;
  });
  const title=state.tab==="all"?"全部皇冠赛事":state.tab==="matched"?"自动匹配比赛":state.tab==="candidates"?"待验证赛事":state.tab==="conflicts"?"冲突赛事": "未对齐赛事";
  const html=groupedRows(rows);
  $("content").innerHTML=`<section class="section" aria-labelledby="resultsHeading"><div class="section-head"><h2 id="resultsHeading">${title}</h2><small>${rows.length} 场</small></div>${html}</section>`;
  highlightOddsChanges(previousOdds);
  requestAnimationFrame(alignSourceHeights);
  const feed=data.pinnacle_feed||{};
  const pinTime=data.pinnacle_updated_at?`平博更新 ${data.pinnacle_updated_at} · ${feed.feed_status||"数据状态未知"}`:"平博等待数据";const crownTime=data.crown_updated_at?`皇冠更新 ${data.crown_updated_at}`:"皇冠等待数据";
  const timezone=data.crown_timezone?` · 皇冠 ${data.crown_timezone} → 平博 UTC`:"";
  const crownWarning=data.crown_stale?" · 皇冠暂不可用，当前显示上次成功数据":data.crown_error?` · 皇冠：${data.crown_error}`:"";
  $("status").textContent=`${crownTime} · ${pinTime}${timezone}${crownWarning}${data.odds_format_warning?" · "+data.odds_format_warning:""}`;
  $("status").classList.toggle("error",Boolean(data.crown_error||data.pinnacle_error));
}
let loadInFlight=false;let renderedVersion="";
function payloadVersion(data){
  return [data.pinnacle_updated_at||"",data.crown_updated_at||"",data.pinnacle_error||"",data.crown_error||"",data.crown_stale?"stale":"",data.pinnacle_total||0,data.crown_total||0,JSON.stringify(data.counts||{}),JSON.stringify((data.confirmed||[]).map(row=>[row.crown?.id,row.pinnacle?.id,row.status]))].join("|");
}
async function load(){
  if(loadInFlight)return;
  loadInFlight=true;
  const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),15000);
  try{const response=await fetch("/api/combined",{cache:"no-store",signal:controller.signal});if(!response.ok)throw new Error("HTTP "+response.status);const payload=await response.json();const version=payloadVersion(payload);state.payload=payload;if(version!==renderedVersion){renderedVersion=version;render();}}
  catch(error){$("status").textContent=error.name==="AbortError"?"读取超时，稍后自动重试":"读取失败："+error.message;$("status").classList.add("error");}
  finally{clearTimeout(timeout);loadInFlight=false;}
}
document.querySelector(".tabs").addEventListener("click",event=>{const button=event.target.closest("[data-tab]");if(!button)return;state.tab=button.dataset.tab;document.querySelectorAll("[data-tab]").forEach(item=>item.setAttribute("aria-pressed",String(item===button)));render();});
$("content").addEventListener("click",event=>{
  const group=event.target.closest("[data-group-toggle]");
  if(group){const key=group.dataset.groupToggle;const collapsed=collapsedGroups.has(key);if(collapsed)collapsedGroups.delete(key);else collapsedGroups.add(key);group.closest(".event-group").classList.toggle("collapsed",!collapsed);group.setAttribute("aria-expanded",String(collapsed));requestAnimationFrame(alignSourceHeights);return;}
  const league=event.target.closest("[data-league-toggle]");
  if(league){const section=league.closest(".league");const key=section?.dataset.leagueKey;if(!key)return;const collapsed=collapsedLeagues.has(key);if(collapsed)collapsedLeagues.delete(key);else collapsedLeagues.add(key);section.classList.toggle("collapsed",!collapsed);league.setAttribute("aria-expanded",String(collapsed));requestAnimationFrame(alignSourceHeights);}
});
$("search").addEventListener("input",render);$("stateFilter").addEventListener("change",render);
window.addEventListener("resize",()=>requestAnimationFrame(alignSourceHeights));
let settingsOpener=null;
function settingsFocusables(){
  return [...$("settingsModal").querySelectorAll('a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])')]
    .filter(element=>element.getAttribute("aria-hidden")!=="true"&&element.getClientRects().length>0);
}
function settingsOpen(){
  const modal=$("settingsModal");
  if(modal.classList.contains("open"))return;
  settingsOpener=document.activeElement instanceof HTMLElement&&document.activeElement!==document.body?document.activeElement:null;
  modal.classList.add("open");
  modal.setAttribute("aria-hidden","false");
  document.body.classList.add("modal-open");
  requestAnimationFrame(()=>$("settingsClose").focus());
}
function settingsClose(){
  const modal=$("settingsModal");
  if(!modal.classList.contains("open"))return;
  modal.classList.remove("open");
  modal.setAttribute("aria-hidden","true");
  document.body.classList.remove("modal-open");
  if(settingsOpener?.isConnected)settingsOpener.focus();
  settingsOpener=null;
}
$("settingsButton").addEventListener("click",settingsOpen);
$("settingsClose").addEventListener("click",settingsClose);
$("settingsModal").addEventListener("click",event=>{if(event.target===$("settingsModal"))settingsClose();});
$("settingsModal").addEventListener("keydown",event=>{
  if(event.key==="Escape"){
    event.preventDefault();
    settingsClose();
    return;
  }
  if(event.key!=="Tab")return;
  const focusables=settingsFocusables();
  if(!focusables.length){event.preventDefault();$("settingsClose").focus();return;}
  const first=focusables[0],last=focusables[focusables.length-1];
  if(event.shiftKey&&(document.activeElement===first||!$("settingsModal").contains(document.activeElement))){event.preventDefault();last.focus();}
  else if(!event.shiftKey&&(document.activeElement===last||!$("settingsModal").contains(document.activeElement))){event.preventDefault();first.focus();}
});
$("settingsModal").addEventListener("click",event=>{if(event.target.closest("a[href]"))settingsClose();});
if(new URLSearchParams(window.location.search).get("openSettings")==="1")settingsOpen();
load();setInterval(load,500);
</script>
